<div class="page">
  <header class="top">
    <button class="back" (click)="goBack()">←</button>
    <div>
      <h2>{{ parkingName }}</h2>
      <p class="sub">Historique de disponibilité</p>
    </div>
  </header>

  <div class="card">
    <h3>Évolution sur {{ periodLabel }}</h3>
    <p class="card-subtitle">Places occupées sur les dernières 5 heures</p>
    <div class="chart-wrap">
      <canvas id="historyChart"></canvas>
      <!-- <div class="chart-loading" *ngIf="isLoading">Chargement des données...</div> -->
    </div>
  </div>

  <div class="card" *ngIf="displayHistory.length > 0">
    <div class="forecast">
      <div class="row" *ngFor="let item of displayHistory">
        <div class="left">
          <span class="hour">{{ item.time | date: 'HH:mm' }}</span>
          <span class="status">{{ item.status }}</span>
        </div>
        <div class="right">
          <strong>{{ item.occupied_spaces }}</strong>
          <span class="small-text">occupées</span>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-message" *ngIf="displayHistory.length === 0 && !isLoading">
    Aucune donnée pour cette période
  </div>

  <div class="panel-actions">
    <button class="action-btn" type="button" (click)="goBack()">Retour à la carte</button>
  </div>
</div>
