<div class="app">
  <!-- Zone carte Leaflet en plein écran -->
  <div id="map"></div>
  <div class="map-dim" *ngIf="showDetailPanel" (click)="showDetailPanel = false"></div>

  <!-- Details Panel -->
  <aside class="detail-panel open" *ngIf="showDetailPanel && selectedParking">
    <app-parking-detail
      [parking]="selectedParking"
      (close)="showDetailPanel = false"
    ></app-parking-detail>
  </aside>

  <!-- Overlay supérieur : recherche à gauche + filtres à droite -->
  <header class="top-overlay">
    <!-- Recherche avec autocomplete -->
    <form class="search-panel" (submit)="$event.preventDefault()">
      <div class="search-box">
        <div class="search-icon-main">
          <svg
            class="w-6 h-6 text-white"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              fill-rule="evenodd"
              d="M11.906 1.994a8.002 8.002 0 0 1 8.09 8.421 7.996 7.996 0 0 1-1.297 3.957.996.996 0 0 1-.133.204l-.108.129c-.178.243-.37.477-.573.699l-5.112 6.224a1 1 0 0 1-1.545 0L5.982 15.26l-.002-.002a18.146 18.146 0 0 1-.309-.38l-.133-.163a.999.999 0 0 1-.13-.202 7.995 7.995 0 0 1 6.498-12.518ZM15 9.997a3 3 0 1 1-5.999 0 3 3 0 0 1 5.999 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <div class="search-input-wrapper">
          <div class="search-input-icon">
            <svg
              class="w-4 h-4"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="2"
                d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
              />
            </svg>
          </div>

          <input
            type="search"
            id="search"
            class="search-input"
            placeholder="Recherche parking par nom"
            autocomplete="off"
            [(ngModel)]="searchTerm"
            name="searchTerm"
            (input)="onSearchChange()"
            (focus)="showSuggestions = true"
            (blur)="onSearchBlur()"
          />

          <!-- Liste des suggestions autocomplete -->
          <div class="autocomplete-list" *ngIf="showSuggestions && filteredParkings.length > 0">
            <button
              type="button"
              class="autocomplete-item"
              *ngFor="let parking of filteredParkings"
              (mousedown)="selectParking(parking)"
            >
              {{ parking.name }}
            </button>
          </div>
        </div>
      </div>
    </form>

    <!-- Filtres et actions -->
    <div class="controls-row">
      <!-- Filtre véhicules -->
      <div class="floating-panel filters-panel">
        <label class="filter-item">
          <input type="checkbox" [checked]="showCars" (change)="toggleCars($event)" />
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              fill="oklch(48.8% 0.243 264.376)"
              d="M147 170.7L117.2 256L240.1 256L240.1 160L162.2 160C155.4 160 149.3 164.3 147.1 170.7zM48.6 257.9L86.5 149.6C97.8 117.5 128.1 96 162.1 96L360 96C385.2 96 408.9 107.9 424 128L520.2 256.3C587.1 260.5 640 316.1 640 384L640 400C640 435.3 611.3 464 576 464L559.6 464C555.6 508.9 517.9 544 472 544C426.1 544 388.4 508.9 384.4 464L239.7 464C235.7 508.9 198 544 152.1 544C106.2 544 68.5 508.9 64.5 464L64.1 464C28.8 464 .1 435.3 .1 400L.1 320C.1 289.9 20.8 264.7 48.7 257.9zM440 256L372.8 166.4C369.8 162.4 365 160 360 160L288 160L288 256L440 256zM152 496C174.1 496 192 478.1 192 456C192 433.9 174.1 416 152 416C129.9 416 112 433.9 112 456C112 478.1 129.9 496 152 496zM512 456C512 433.9 494.1 416 472 416C449.9 416 432 433.9 432 456C432 478.1 449.9 496 472 496C494.1 496 512 478.1 512 456z"
            />
          </svg>
          <span>Voitures</span>
        </label>

        <div class="divider"></div>

        <label class="filter-item">
          <input type="checkbox" [checked]="showBikes" (change)="toggleBikes($event)" />
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              fill="oklch(48.8% 0.243 150)"
              d="M331.7 107.3C336 100.3 343.7 96 352 96L456 96C469.3 96 480 106.7 480 120C480 133.3 469.3 144 456 144L390.4 144L462.6 292.4C473.3 289.5 484.5 288 496 288C566.7 288 624 345.3 624 416C624 486.7 566.7 544 496 544C425.3 544 368 486.7 368 416C368 374 388.2 336.8 419.4 313.4L399 271.5L325.5 418.5C323.2 423.3 319.2 427.3 314.1 429.7C313.5 430 312.9 430.2 312.3 430.4C309.4 431.5 306.4 432 303.4 431.9L271 432C263.1 495.1 209.3 544 144 544C73.3 544 16 486.7 16 416C16 345.3 73.3 288 144 288C154.8 288 165.2 289.3 175.2 291.8L203.7 234.9L192.2 208L152 208C138.7 208 128 197.3 128 184C128 170.7 138.7 160 152 160L208 160C217.6 160 226.3 165.7 230.1 174.5L244.4 208L368.1 208L330.4 130.5C326.8 123.1 327.2 114.3 331.6 107.3zM228.5 292.7L182.9 384L267.7 384L228.6 292.7zM305.7 351L353.2 256L265 256L305.7 351zM474.4 426.5L444.7 365.5C431.9 378.5 424 396.3 424 416C424 455.8 456.2 488 496 488C535.8 488 568 455.8 568 416C568 376.2 535.8 344 496 344C493.3 344 490.5 344.2 487.9 344.5L517.6 405.5C523.4 417.4 518.4 431.8 506.5 437.6C494.6 443.4 480.2 438.4 474.4 426.5zM149.2 432C129 432 115.8 410.7 124.9 392.6L149.1 344.1C147.4 344 145.7 343.9 144 343.9C104.2 343.9 72 376.1 72 415.9C72 455.7 104.2 487.9 144 487.9C178.3 487.9 206.9 464 214.2 431.9L149.2 431.9z"
            />
          </svg>
          <span>Vélos</span>
        </label>
      </div>

      <!-- Bouton localisation -->
      <div class="floating-panel actions-panel">
        <button type="button" class="action-btn" (click)="locateUser()">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.5 13.5 21 3m0 0h-6.75M21 3v6.75"
            />
          </svg>
          <span>Locate Me</span>
        </button>

        <div class="divider"></div>

        <!-- <button type="button" class="action-btn" (click)="focusNearestParking()">
          <span>Nearest Space</span>
        </button> -->

        <div class="divider"></div>

        <button type="button" class="icon-btn" aria-label="Settings">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.34 2.37a1 1 0 0 1 1.32 0l.77.67a1 1 0 0 0 1.1.17l.94-.47a1 1 0 0 1 1.4.73l.13 1.01a1 1 0 0 0 .77.85l1 .23a1 1 0 0 1 .66 1.43l-.47.93a1 1 0 0 0 .16 1.1l.68.78a1 1 0 0 1 0 1.31l-.68.78a1 1 0 0 0-.16 1.1l.47.94a1 1 0 0 1-.66 1.42l-1 .24a1 1 0 0 0-.77.84l-.13 1.01a1 1 0 0 1-1.4.74l-.94-.48a1 1 0 0 0-1.1.17l-.77.67a1 1 0 0 1-1.32 0l-.77-.67a1 1 0 0 0-1.1-.17l-.94.48a1 1 0 0 1-1.4-.74l-.13-1.01a1 1 0 0 0-.77-.84l-1-.24a1 1 0 0 1-.66-1.42l.47-.94a1 1 0 0 0-.16-1.1l-.68-.78a1 1 0 0 1 0-1.31l.68-.78a1 1 0 0 0 .16-1.1l-.47-.93a1 1 0 0 1 .66-1.43l1-.23a1 1 0 0 0 .77-.85l.13-1.01a1 1 0 0 1 1.4-.73l.94.47a1 1 0 0 0 1.1-.17l.77-.67Z"
            />
            <path
              stroke="currentColor"
              stroke-width="2"
              d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Carte parking sélectionné -->
  <div class="card" *ngIf="selectedParking" (click)="goToDetail()">
    <div class="card-header">
      <h3>{{ selectedParking.name }}</h3>

      <span
        class="badge"
        [ngClass]="{
          green: selectedParking.free > 50,
          orange: selectedParking.free <= 50 && selectedParking.free > 10,
          red: selectedParking.free <= 10,
        }"
      >
        {{ selectedParking.free }} places
      </span>
    </div>

    <div class="progress-wrapper">
      <div
        class="progress"
        [style.width.%]="(selectedParking.free / selectedParking.total) * 100"
      ></div>
    </div>

    <p class="distance" *ngIf="selectedParking.distance">
      {{ selectedParking.distance | number: '1.0-2' }} km de votre position
    </p>

    <div class="card-footer">Voir les détails</div>
  </div>
</div>
