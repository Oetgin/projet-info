services:
  mysql:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./database:/var/lib/mysql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  crawler:
    restart: unless-stopped
    build:
      dockerfile: "Dockerfile"
    depends_on:
      - mysql

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./grafana:/var/lib/grafana
    user: '0'